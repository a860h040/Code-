<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MUE Data Collection</title>

  <style>
    :root {
      --navy: #123b5d;
      --navy-dark: #0b2a42;
      --teal: #1f6f78;
      --teal-soft: #e6f3f3;
      --page: #f3f7fa;
      --surface: #ffffff;
      --ink: #172330;
      --muted: #647483;
      --line: #d8e2ea;
      --line-strong: #c4d2dc;
      --success: #087a55;
      --success-soft: #eaf8f2;
      --danger: #b42318;
      --danger-soft: #fff0ee;
      --warning: #9a6700;
      --warning-soft: #fff8e6;
      --shadow: 0 14px 36px rgba(23, 53, 77, 0.10);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top right, rgba(31, 111, 120, 0.10), transparent 28rem),
        var(--page);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 30;
      border-bottom: 1px solid rgba(216, 226, 234, 0.92);
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(14px);
    }

    .header-inner {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 15px 0 12px;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 13px;
      background: linear-gradient(145deg, var(--navy), var(--teal));
      color: #fff;
      font-weight: 900;
      letter-spacing: 0.04em;
      box-shadow: 0 8px 20px rgba(18, 59, 93, 0.22);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.05rem, 2vw, 1.35rem);
      line-height: 1.2;
    }

    .subtitle {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 0.86rem;
    }

    .status-pill {
      max-width: 390px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      font-size: 0.8rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #9aa8b4;
    }

    .status-pill.ready .status-dot {
      background: var(--success);
    }

    .status-pill.error .status-dot {
      background: var(--danger);
    }

    .progress-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
    }

    .progress-track {
      height: 7px;
      overflow: hidden;
      border-radius: 999px;
      background: #e5edf3;
    }

    .progress-bar {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--navy), var(--teal));
      transition: width 180ms ease;
    }

    .progress-text {
      min-width: 120px;
      color: var(--muted);
      text-align: right;
      font-size: 0.8rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .page {
      width: min(1180px, calc(100% - 32px));
      margin: 22px auto 112px;
    }

    .notice {
      display: none;
      margin-bottom: 14px;
      padding: 13px 15px;
      border-radius: 13px;
      font-size: 0.82rem;
    }

    .notice.visible {
      display: block;
    }

    .notice.warning {
      border: 1px solid #ecd394;
      background: var(--warning-soft);
      color: #765100;
    }

    .notice.error {
      border: 1px solid #f0b9b5;
      background: var(--danger-soft);
      color: var(--danger);
    }

    .patient-card {
      overflow: hidden;
      margin-bottom: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .patient-card-header {
      padding: 18px 20px 10px;
      background:
        linear-gradient(110deg, rgba(18, 59, 93, 0.06), rgba(31, 111, 120, 0.03)),
        #fff;
    }

    .patient-overline {
      margin-bottom: 5px;
      color: var(--teal);
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .patient-name {
      margin: 0;
      color: var(--navy-dark);
      font-size: clamp(1.25rem, 3vw, 1.8rem);
      line-height: 1.2;
    }

    .identity-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      padding: 12px 20px 18px;
    }

    .identity-item {
      min-width: 0;
      padding: 11px 13px;
      border: 1px solid #e5edf3;
      border-radius: 12px;
      background: #fbfdfe;
    }

    .identity-label {
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .identity-value {
      overflow-wrap: anywhere;
      color: var(--ink);
      font-size: 0.92rem;
      font-weight: 800;
    }

    .fin-value-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
    }

    .fin-value-row .identity-value {
      min-width: 0;
      flex: 1 1 auto;
    }

    .copy-fin-button {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 34px;
      padding: 6px 10px;
      border: 1px solid #cbd8e2;
      border-radius: 9px;
      background: #ffffff;
      color: var(--navy);
      font-size: 0.74rem;
      font-weight: 850;
      cursor: pointer;
      white-space: nowrap;
      transition: background 130ms ease, border-color 130ms ease, color 130ms ease, transform 130ms ease;
    }

    .copy-fin-button:hover {
      border-color: var(--teal);
      background: var(--teal-light);
      color: #155d65;
    }

    .copy-fin-button:active {
      transform: translateY(1px);
    }

    .copy-fin-button.copied {
      border-color: #8bcdb3;
      background: var(--success-light);
      color: var(--success);
    }

    .copy-fin-button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .missing-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 20px;
      border-top: 1px solid #edf2f5;
      background: #fcfeff;
      color: #3e5363;
      font-size: 0.82rem;
    }

    .missing-badge {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 4px 9px;
      border-radius: 999px;
      background: #eef4f8;
      color: var(--navy);
      font-size: 0.75rem;
      font-weight: 850;
    }

    .section-card {
      overflow: hidden;
      margin-bottom: 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .section-header {
      padding: 15px 18px;
      border-bottom: 1px solid #edf2f5;
      background: linear-gradient(90deg, #ffffff, #f8fbfd);
    }

    .section-title {
      margin: 0;
      color: var(--navy);
      font-size: 0.98rem;
    }

    .section-subtitle {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 0.76rem;
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px;
      padding: 18px;
    }

    .field {
      min-width: 0;
    }

    .field.wide {
      grid-column: 1 / -1;
    }

    .field-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 7px;
    }

    .field-label {
      color: #293846;
      font-size: 0.82rem;
      font-weight: 800;
    }

    .unit {
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 700;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 44px;
      border: 1px solid #cbd8e2;
      border-radius: 11px;
      outline: none;
      background: #fff;
      color: var(--ink);
      transition: border-color 130ms ease, box-shadow 130ms ease;
    }

    input,
    select {
      padding: 9px 11px;
    }

    textarea {
      min-height: 94px;
      padding: 10px 11px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(31, 111, 120, 0.12);
    }

    .choice-group {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      min-height: 44px;
      padding: 5px;
      border: 1px solid #cbd8e2;
      border-radius: 11px;
      background: #f8fafc;
    }

    .choice-button {
      min-height: 32px;
      flex: 1 1 95px;
      padding: 6px 10px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: #425463;
      font-size: 0.78rem;
      font-weight: 800;
    }

    .choice-button:hover {
      background: #eaf1f5;
    }

    .choice-button.selected {
      border-color: #a7cbd0;
      background: #dff0f1;
      color: #125761;
    }

    .comment-row {
      margin-top: 7px;
    }

    .comment-toggle {
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--teal);
      font-size: 0.74rem;
      font-weight: 800;
    }

    .comment-input {
      display: none;
      margin-top: 7px;
    }

    .comment-input.visible {
      display: block;
    }

    .comment-input input {
      min-height: 39px;
      font-size: 0.8rem;
    }

    .existing-card {
      margin-top: 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
    }

    .existing-card summary {
      cursor: pointer;
      padding: 13px 15px;
      color: #3b5162;
      font-size: 0.82rem;
      font-weight: 850;
      user-select: none;
    }

    .existing-body {
      padding: 0 15px 15px;
      border-top: 1px solid #edf2f5;
    }

    .existing-section {
      margin-top: 14px;
    }

    .existing-section h3 {
      margin: 0 0 8px;
      color: var(--navy);
      font-size: 0.78rem;
    }

    .existing-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px 14px;
    }

    .existing-item {
      min-width: 0;
      padding: 8px 10px;
      border-radius: 9px;
      background: #f8fbfd;
    }

    .existing-label {
      color: var(--muted);
      font-size: 0.67rem;
      font-weight: 800;
    }

    .existing-value {
      margin-top: 2px;
      overflow-wrap: anywhere;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .empty-patient {
      padding: 26px;
      border: 1px solid #b9dfd1;
      border-radius: var(--radius);
      background: var(--success-soft);
      color: #155f46;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .empty-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 12px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--success);
      color: #fff;
      font-size: 1.6rem;
      font-weight: 900;
    }

    .empty-patient h2 {
      margin: 0;
      font-size: 1.15rem;
    }

    .empty-patient p {
      margin: 8px auto 0;
      max-width: 680px;
      font-size: 0.84rem;
    }

    .error-panel {
      display: none;
      padding: 20px;
      border: 1px solid #efbbb7;
      border-radius: var(--radius);
      background: var(--danger-soft);
      color: var(--danger);
      box-shadow: var(--shadow);
    }

    .error-panel.visible {
      display: block;
    }

    .error-panel h2 {
      margin: 0 0 7px;
      font-size: 1rem;
    }

    .error-panel p {
      margin: 0 0 14px;
      font-size: 0.83rem;
      white-space: pre-wrap;
    }

    .sticky-actions {
      position: fixed;
      z-index: 40;
      left: 0;
      right: 0;
      bottom: 0;
      border-top: 1px solid rgba(216, 226, 234, 0.95);
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(14px);
      box-shadow: 0 -10px 28px rgba(23, 53, 77, 0.08);
    }

    .actions-inner {
      width: min(1180px, calc(100% - 32px));
      min-height: 76px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .action-info {
      color: var(--muted);
      font-size: 0.79rem;
    }

    .action-buttons {
      display: flex;
      gap: 9px;
    }

    .button {
      min-height: 42px;
      padding: 9px 15px;
      border-radius: 11px;
      font-weight: 850;
    }

    .button:disabled {
      cursor: not-allowed;
      opacity: 0.52;
    }

    .button-secondary {
      border: 1px solid var(--line-strong);
      background: #fff;
      color: #425463;
    }

    .button-secondary:hover:not(:disabled) {
      background: #f3f7fa;
    }

    .button-skip {
      border: 1px solid #d9c78e;
      background: #fffdf7;
      color: #765100;
    }

    .button-skip:hover:not(:disabled) {
      background: #fff8e6;
    }

    .button-primary {
      border: 1px solid var(--navy);
      background: linear-gradient(135deg, var(--navy), #18547f);
      color: #fff;
      box-shadow: 0 8px 18px rgba(18, 59, 93, 0.18);
    }

    .button-primary:hover:not(:disabled) {
      filter: brightness(1.05);
    }

    .loading-overlay {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: none;
      place-items: center;
      padding: 22px;
      background: rgba(243, 247, 250, 0.72);
      backdrop-filter: blur(3px);
    }

    .loading-overlay.visible {
      display: grid;
    }

    .loading-card {
      min-width: 220px;
      padding: 20px 24px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 22px 60px rgba(18, 45, 64, 0.18);
      color: var(--navy);
      text-align: center;
      font-size: 0.86rem;
      font-weight: 800;
    }

    .spinner {
      width: 28px;
      height: 28px;
      margin: 0 auto 11px;
      border: 3px solid #d9e6ed;
      border-top-color: var(--teal);
      border-radius: 50%;
      animation: spin 700ms linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .toast {
      position: fixed;
      z-index: 150;
      right: 20px;
      bottom: 94px;
      max-width: min(440px, calc(100% - 40px));
      display: none;
      padding: 13px 15px;
      border-radius: 12px;
      box-shadow: 0 16px 42px rgba(15, 39, 56, 0.20);
      font-size: 0.84rem;
      font-weight: 800;
    }

    .toast.visible {
      display: block;
    }

    .toast.success {
      border: 1px solid #b8e0d1;
      background: var(--success-soft);
      color: var(--success);
    }

    .toast.error {
      border: 1px solid #f2b8b5;
      background: var(--danger-soft);
      color: var(--danger);
    }

    @media (max-width: 760px) {
      .header-inner,
      .page,
      .actions-inner {
        width: min(100% - 22px, 1180px);
      }

      .status-pill {
        display: none;
      }

      .identity-grid,
      .field-grid,
      .existing-grid {
        grid-template-columns: 1fr;
      }

      .field.wide {
        grid-column: auto;
      }

      .action-info {
        display: none;
      }

      .action-buttons {
        width: 100%;
      }

      .action-buttons .button {
        flex: 1;
        padding-left: 9px;
        padding-right: 9px;
        font-size: 0.77rem;
      }

      .page {
        margin-top: 14px;
      }
    }
  </style>
</head>

<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="title-row">
        <div class="brand">
          <div class="brand-mark">MUE</div>
          <div>
            <h1>Apixaban Post-Orthopedic Surgery</h1>
            <p class="subtitle">Missing-data patient review from Sheet1</p>
          </div>
        </div>

        <div class="status-pill" id="appStatus">
          <span class="status-dot"></span>
          <span id="statusText">Connecting to Sheet1…</span>
        </div>
      </div>

      <div class="progress-row">
        <div class="progress-track" aria-hidden="true">
          <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="progress-text" id="progressText">Loading…</div>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="notice warning" id="warningNotice"></div>
    <div class="notice error" id="duplicateNotice"></div>

    <div id="patientContainer"></div>

    <div class="error-panel" id="errorPanel">
      <h2>Unable to load the patient workflow</h2>
      <p id="errorMessage"></p>
      <button class="button button-primary" type="button" id="retryButton">Retry</button>
    </div>
  </main>

  <footer class="sticky-actions" id="actionBar">
    <div class="actions-inner">
      <div class="action-info" id="actionInfo">Only blank Sheet1 fields will be saved.</div>

      <div class="action-buttons">
        <button class="button button-secondary" type="button" id="previousButton">
          Previous Patient
        </button>
        <button class="button button-skip" type="button" id="skipButton">
          Skip Patient
        </button>
        <button class="button button-primary" type="button" id="saveNextButton">
          Save &amp; Next
        </button>
      </div>
    </div>
  </footer>

  <div class="loading-overlay" id="loadingOverlay" aria-live="polite" aria-busy="true">
    <div class="loading-card">
      <div class="spinner"></div>
      <div id="loadingText">Loading patient data…</div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    'use strict';

    const SERVER_TIMEOUT_MS = 45000;

    let bootstrapData = null;
    let reviewQueue = [];
    let currentIndex = -1;
    let currentPatient = null;
    let isBusy = false;
    let toastTimer = null;
    let passNumber = 1;

    const drafts = Object.create(null);

    document.addEventListener('DOMContentLoaded', initializeApp);

    function initializeApp() {
      bindEvents();

      if (!window.google || !google.script || !google.script.run) {
        showFatalError(
          'This page must be opened through the deployed Google Apps Script web app.'
        );
        return;
      }

      loadBootstrap();
    }

    function bindEvents() {
      document.getElementById('previousButton').addEventListener('click', goPrevious);
      document.getElementById('skipButton').addEventListener('click', skipPatient);
      document.getElementById('saveNextButton').addEventListener('click', saveAndNext);
      document.getElementById('retryButton').addEventListener('click', loadBootstrap);

      document.getElementById('patientContainer').addEventListener('click', event => {
        const copyFinButton = event.target.closest('[data-copy-fin]');
        if (copyFinButton) {
          copyCurrentFin(copyFinButton);
          return;
        }

        const choiceButton = event.target.closest('[data-choice-field]');
        if (choiceButton) {
          selectChoice(choiceButton);
          return;
        }

        const commentToggle = event.target.closest('[data-comment-toggle]');
        if (commentToggle) {
          toggleComment(commentToggle.dataset.commentToggle);
        }
      });

      document.getElementById('patientContainer').addEventListener('input', saveCurrentDraft);
      document.getElementById('patientContainer').addEventListener('change', saveCurrentDraft);
    }

    async function loadBootstrap() {
      if (isBusy) return;

      clearFatalError();
      setBusy(true, 'Loading patients from Sheet1…');

      try {
        const data = await serverGetReviewBootstrap();
        bootstrapData = data;
        reviewQueue = Array.isArray(data.queue) ? data.queue.slice() : [];
        currentIndex = -1;
        currentPatient = null;

        renderWarnings(data);
        updateStatus(data);

        if (!reviewQueue.length) {
          showEndState(data);
          return;
        }

        if (
          data.firstPatient &&
          normalizeFin(data.firstPatient.fin) === normalizeFin(reviewQueue[0].fin)
        ) {
          currentIndex = 0;
          currentPatient = data.firstPatient;
          renderPatient(currentPatient);
          return;
        }

        await loadPatientAtIndex(0, false);
      } catch (error) {
        showFatalError(getErrorMessage(error));
      } finally {
        setBusy(false);
      }
    }

    async function loadPatientAtIndex(index, allowCompleted) {
      if (!reviewQueue.length) {
        await refreshAfterPass();
        return;
      }

      if (index < 0) {
        index = 0;
      }

      if (index >= reviewQueue.length) {
        await refreshAfterPass();
        return;
      }

      currentIndex = index;
      updateProgress();

      const queuePatient = reviewQueue[currentIndex];

      setBusy(true, 'Loading patient…');

      try {
        const patient = await serverGetPatientReviewData(queuePatient.fin);
        currentPatient = patient;

        if (patient.completed && !allowCompleted) {
          setBusy(false);
          await loadPatientAtIndex(currentIndex + 1, false);
          return;
        }

        renderPatient(patient);
      } catch (error) {
        showToast(getErrorMessage(error), 'error');
        showPatientLoadError(queuePatient.fin, getErrorMessage(error));
      } finally {
        setBusy(false);
      }
    }

    async function saveAndNext() {
      if (isBusy || !currentPatient) return;

      saveCurrentDraft();

      const values = collectValues();
      const payload = {
        fin: currentPatient.fin,
        values: values
      };

      setBusy(true, 'Saving to Sheet1…');

      try {
        const result = await serverSavePatientMissingData(payload);

        delete drafts[finKey(currentPatient.fin)];

        if (result.patient) {
          currentPatient = result.patient;
          if (reviewQueue[currentIndex]) {
            reviewQueue[currentIndex].missingCount = result.patient.missingCount;
          }
        }

        const updatedCount = Number(result.updatedCount || 0);
        showToast(
          updatedCount
            ? `${updatedCount} field${updatedCount === 1 ? '' : 's'} saved.`
            : 'No new values were entered. Moving to the next patient.',
          'success'
        );

        setBusy(false);
        await loadPatientAtIndex(currentIndex + 1, false);
      } catch (error) {
        showToast(getErrorMessage(error), 'error');
      } finally {
        setBusy(false);
      }
    }

    async function skipPatient() {
      if (isBusy || !currentPatient) return;

      saveCurrentDraft();
      showToast('Patient skipped. No Sheet1 data were changed.', 'success');
      await loadPatientAtIndex(currentIndex + 1, false);
    }

    async function goPrevious() {
      if (isBusy || !currentPatient || currentIndex <= 0) return;

      saveCurrentDraft();
      await loadPatientAtIndex(currentIndex - 1, true);
    }

    async function refreshAfterPass() {
      setBusy(true, 'Checking for remaining missing data…');

      try {
        const data = await serverGetReviewBootstrap();

        bootstrapData = data;
        renderWarnings(data);
        updateStatus(data);

        const remaining = Array.isArray(data.queue) ? data.queue : [];

        if (!remaining.length) {
          reviewQueue = [];
          currentIndex = -1;
          currentPatient = null;
          showEndState(data);
          return;
        }

        passNumber++;
        reviewQueue = remaining.slice();
        currentIndex = -1;
        currentPatient = null;

        showToast(
          `${remaining.length} patient${remaining.length === 1 ? '' : 's'} still need review. Starting the next pass.`,
          'success'
        );

        if (
          data.firstPatient &&
          normalizeFin(data.firstPatient.fin) === normalizeFin(reviewQueue[0].fin)
        ) {
          currentIndex = 0;
          currentPatient = data.firstPatient;
          renderPatient(currentPatient);
        } else {
          setBusy(false);
          await loadPatientAtIndex(0, false);
        }
      } catch (error) {
        showFatalError(getErrorMessage(error));
      } finally {
        setBusy(false);
      }
    }

    function renderPatient(patient) {
      clearFatalError();

      const container = document.getElementById('patientContainer');
      const missingFields = Array.isArray(patient.missingFields) ? patient.missingFields : [];
      const grouped = groupFieldsBySection(missingFields);

      const sectionsHtml = grouped.length
        ? grouped.map(section => `
            <section class="section-card">
              <div class="section-header">
                <h2 class="section-title">${escapeHtml(section.title)}</h2>
                <p class="section-subtitle">${section.fields.length} missing field${section.fields.length === 1 ? '' : 's'} in this section</p>
              </div>
              <div class="field-grid">
                ${section.fields.map(renderField).join('')}
              </div>
            </section>
          `).join('')
        : `
          <div class="empty-patient">
            <div class="empty-icon">✓</div>
            <h2>This patient currently has no missing review fields.</h2>
            <p>You can use Previous Patient to review this record or continue to the next patient.</p>
          </div>
        `;

      container.innerHTML = `
        <section class="patient-card">
          <div class="patient-card-header">
            <div class="patient-overline">Current patient</div>
            <h2 class="patient-name">${escapeHtml(patient.patientName || 'Not available')}</h2>
          </div>

          <div class="identity-grid">
            <div class="identity-item">
              <div class="identity-label">Patient Name</div>
              <div class="identity-value">${escapeHtml(patient.patientName || 'Not available')}</div>
            </div>

            <div class="identity-item">
              <div class="identity-label">Date of Birth</div>
              <div class="identity-value">${escapeHtml(patient.dob || 'Not available')}</div>
            </div>

            <div class="identity-item">
              <div class="identity-label">FIN</div>
              <div class="fin-value-row">
                <div class="identity-value" id="patientFinValue">${escapeHtml(patient.fin || '')}</div>
                <button
                  type="button"
                  class="copy-fin-button"
                  data-copy-fin
                  aria-label="Copy FIN ${escapeHtml(patient.fin || '')}"
                  title="Copy FIN to clipboard"
                >
                  <span aria-hidden="true">📋</span>
                  <span data-copy-fin-label>Copy FIN</span>
                </button>
              </div>
            </div>
          </div>

          <div class="missing-summary">
            <span>Only blank fields from this Sheet1 row are shown below.</span>
            <span class="missing-badge">${patient.missingCount || 0} missing</span>
          </div>
        </section>

        <form id="missingDataForm" novalidate>
          ${sectionsHtml}
        </form>

        ${renderExistingData(patient.existingFields || [])}
      `;

      restoreDraftForCurrentPatient();
      applyDefaultCollectionDate();
      updateProgress();
      updateButtons();

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderField(field) {
      const wide = field.type === 'textarea' ? 'wide' : '';
      const unit = field.suffix
        ? `<span class="unit">${escapeHtml(field.suffix)}</span>`
        : '';

      return `
        <div class="field ${wide}" data-field-wrapper="${escapeHtml(field.id)}">
          <div class="field-label-row">
            <label class="field-label" for="${escapeHtml(field.id)}">${escapeHtml(field.label)}</label>
            ${unit}
          </div>

          ${renderControl(field)}
        </div>
      `;
    }

    function renderControl(field) {
      const id = escapeHtml(field.id);
      const placeholder = field.placeholder
        ? `placeholder="${escapeHtml(field.placeholder)}"`
        : '';

      if (field.type === 'choice') {
        const buttons = (field.options || []).map(option => `
          <button
            type="button"
            class="choice-button"
            data-choice-field="${id}"
            data-choice-value="${escapeHtml(option)}"
            aria-pressed="false"
          >
            ${escapeHtml(option)}
          </button>
        `).join('');

        return `
          <div class="choice-group" role="group" aria-label="${escapeHtml(field.label)}">
            ${buttons}
          </div>

          <input type="hidden" id="${id}" data-field-id="${id}">

          ${field.comment ? `
            <div class="comment-row">
              <button
                type="button"
                class="comment-toggle"
                data-comment-toggle="${id}"
              >
                + Add comment
              </button>
            </div>

            <div class="comment-input" data-comment-wrap="${id}">
              <input
                type="text"
                data-comment-for="${id}"
                placeholder="Optional detail or chart comment"
              >
            </div>
          ` : ''}
        `;
      }

      if (field.type === 'select') {
        return `
          <select id="${id}" data-field-id="${id}">
            <option value="">Choose…</option>
            ${(field.options || []).map(option =>
              `<option value="${escapeHtml(option)}">${escapeHtml(option)}</option>`
            ).join('')}
          </select>
        `;
      }

      if (field.type === 'textarea') {
        return `
          <textarea
            id="${id}"
            data-field-id="${id}"
            ${placeholder}
          ></textarea>
        `;
      }

      if (field.type === 'number') {
        const min = field.min !== null && field.min !== undefined
          ? `min="${escapeHtml(field.min)}"`
          : '';
        const max = field.max !== null && field.max !== undefined
          ? `max="${escapeHtml(field.max)}"`
          : '';
        const step = field.step !== null && field.step !== undefined
          ? `step="${escapeHtml(field.step)}"`
          : 'step="any"';

        return `
          <input
            type="number"
            id="${id}"
            data-field-id="${id}"
            ${min}
            ${max}
            ${step}
            ${placeholder}
          >
        `;
      }

      if (field.type === 'date') {
        return `<input type="date" id="${id}" data-field-id="${id}">`;
      }

      if (field.type === 'datetime') {
        return `<input type="datetime-local" id="${id}" data-field-id="${id}">`;
      }

      return `
        <input
          type="text"
          id="${id}"
          data-field-id="${id}"
          ${placeholder}
        >
      `;
    }

    function renderExistingData(existingFields) {
      if (!existingFields.length) return '';

      const sections = groupExistingBySection(existingFields);

      return `
        <details class="existing-card">
          <summary>View information already completed in Sheet1 (${existingFields.length})</summary>

          <div class="existing-body">
            ${sections.map(section => `
              <div class="existing-section">
                <h3>${escapeHtml(section.title)}</h3>

                <div class="existing-grid">
                  ${section.fields.map(field => `
                    <div class="existing-item">
                      <div class="existing-label">${escapeHtml(field.label)}</div>
                      <div class="existing-value">${escapeHtml(field.value)}</div>
                    </div>
                  `).join('')}
                </div>
              </div>
            `).join('')}
          </div>
        </details>
      `;
    }

    function groupFieldsBySection(fields) {
      const order = [
        ['patient', 'Patient characteristics'],
        ['surgery', 'Surgery and hospitalization'],
        ['regimen', 'Apixaban regimen'],
        ['labs', 'Laboratory data'],
        ['medications', 'Concomitant medications']
      ];

      return order
        .map(([id, title]) => ({
          id,
          title,
          fields: fields.filter(field => field.sectionId === id)
        }))
        .filter(section => section.fields.length);
    }

    function groupExistingBySection(fields) {
      const map = new Map();

      fields.forEach(field => {
        const key = field.sectionId || 'other';

        if (!map.has(key)) {
          map.set(key, {
            id: key,
            title: field.sectionTitle || 'Other information',
            fields: []
          });
        }

        map.get(key).fields.push(field);
      });

      return Array.from(map.values());
    }

    function selectChoice(button) {
      const fieldId = button.dataset.choiceField;
      const value = button.dataset.choiceValue;
      const hidden = document.getElementById(fieldId);
      const group = button.closest('.choice-group');

      if (!hidden || !group) return;

      group.querySelectorAll('.choice-button').forEach(item => {
        const selected = item === button;
        item.classList.toggle('selected', selected);
        item.setAttribute('aria-pressed', String(selected));
      });

      hidden.value = value;

      const field = getCurrentMissingField(fieldId);
      if (field && field.comment && value === 'Yes') {
        showComment(fieldId);
      }

      saveCurrentDraft();
    }

    function toggleComment(fieldId) {
      const wrap = document.querySelector(
        `[data-comment-wrap="${cssEscape(fieldId)}"]`
      );
      const toggle = document.querySelector(
        `[data-comment-toggle="${cssEscape(fieldId)}"]`
      );

      if (!wrap || !toggle) return;

      const show = !wrap.classList.contains('visible');
      wrap.classList.toggle('visible', show);
      toggle.textContent = show ? '− Hide comment' : '+ Add comment';

      if (show) {
        const input = wrap.querySelector('input');
        if (input) input.focus();
      }
    }

    function showComment(fieldId) {
      const wrap = document.querySelector(
        `[data-comment-wrap="${cssEscape(fieldId)}"]`
      );
      const toggle = document.querySelector(
        `[data-comment-toggle="${cssEscape(fieldId)}"]`
      );

      if (!wrap || !toggle) return;

      wrap.classList.add('visible');
      toggle.textContent = '− Hide comment';
    }

    async function copyCurrentFin(button) {
      const fin = currentPatient && currentPatient.fin !== null && currentPatient.fin !== undefined
        ? String(currentPatient.fin).trim()
        : '';

      if (!fin) {
        showToast('No FIN is available to copy.', 'error');
        return;
      }

      if (button) {
        button.disabled = true;
      }

      try {
        await copyTextToClipboard(fin);
        setCopyFinButtonState(button, true);
        showToast('FIN copied to clipboard.', 'success');
      } catch (error) {
        console.error('FIN copy failed:', error);
        showToast('Unable to copy the FIN. You can still select it manually.', 'error');
        if (button) {
          button.disabled = false;
        }
      }
    }

    async function copyTextToClipboard(text) {
      if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
        try {
          await navigator.clipboard.writeText(text);
          return;
        } catch (error) {
          console.warn('Clipboard API unavailable; using fallback copy method.', error);
        }
      }

      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.setAttribute('readonly', '');
      textarea.style.position = 'fixed';
      textarea.style.left = '-9999px';
      textarea.style.top = '0';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);

      const selection = document.getSelection();
      const previousRange = selection && selection.rangeCount
        ? selection.getRangeAt(0)
        : null;

      textarea.focus();
      textarea.select();
      textarea.setSelectionRange(0, textarea.value.length);

      let copied = false;
      try {
        copied = document.execCommand('copy');
      } finally {
        document.body.removeChild(textarea);

        if (previousRange && selection) {
          selection.removeAllRanges();
          selection.addRange(previousRange);
        }
      }

      if (!copied) {
        throw new Error('The browser did not allow clipboard access.');
      }
    }

    function setCopyFinButtonState(button, copied) {
      if (!button) return;

      const label = button.querySelector('[data-copy-fin-label]');
      const icon = button.querySelector('[aria-hidden="true"]');

      button.classList.toggle('copied', Boolean(copied));
      button.disabled = false;

      if (label) {
        label.textContent = copied ? 'Copied' : 'Copy FIN';
      }

      if (icon) {
        icon.textContent = copied ? '✓' : '📋';
      }

      if (copied) {
        window.setTimeout(() => {
          if (!document.body.contains(button)) return;
          setCopyFinButtonState(button, false);
        }, 1600);
      }
    }

    function collectValues() {
      const result = {};

      if (!currentPatient || !Array.isArray(currentPatient.missingFields)) {
        return result;
      }

      currentPatient.missingFields.forEach(field => {
        const input = document.getElementById(field.id);
        if (!input) return;

        let value = String(input.value || '').trim();

        if (field.comment) {
          const commentInput = document.querySelector(
            `[data-comment-for="${cssEscape(field.id)}"]`
          );
          const comment = commentInput
            ? String(commentInput.value || '').trim()
            : '';

          if (value && comment) {
            value = `${value} — ${comment}`;
          }
        }

        if (value !== '') {
          result[field.id] = value;
        }
      });

      return result;
    }

    function saveCurrentDraft() {
      if (!currentPatient) return;

      const key = finKey(currentPatient.fin);
      const draft = {
        values: {},
        comments: {}
      };

      (currentPatient.missingFields || []).forEach(field => {
        const input = document.getElementById(field.id);

        if (input) {
          draft.values[field.id] = input.value || '';
        }

        if (field.comment) {
          const commentInput = document.querySelector(
            `[data-comment-for="${cssEscape(field.id)}"]`
          );

          if (commentInput) {
            draft.comments[field.id] = commentInput.value || '';
          }
        }
      });

      drafts[key] = draft;
    }

    function restoreDraftForCurrentPatient() {
      if (!currentPatient) return;

      const draft = drafts[finKey(currentPatient.fin)];
      if (!draft) return;

      (currentPatient.missingFields || []).forEach(field => {
        const input = document.getElementById(field.id);
        if (!input) return;

        const value = draft.values && draft.values[field.id] !== undefined
          ? draft.values[field.id]
          : '';

        input.value = value;

        if (field.type === 'choice' && value) {
          document.querySelectorAll(
            `[data-choice-field="${cssEscape(field.id)}"]`
          ).forEach(button => {
            const selected = button.dataset.choiceValue === value;
            button.classList.toggle('selected', selected);
            button.setAttribute('aria-pressed', String(selected));
          });
        }

        if (field.comment) {
          const comment = draft.comments && draft.comments[field.id]
            ? draft.comments[field.id]
            : '';

          const commentInput = document.querySelector(
            `[data-comment-for="${cssEscape(field.id)}"]`
          );

          if (commentInput && comment) {
            commentInput.value = comment;
            showComment(field.id);
          }
        }
      });
    }

    function applyDefaultCollectionDate() {
      if (!currentPatient) return;

      const fieldExists = (currentPatient.missingFields || []).some(
        field => field.id === 'collectionDate'
      );

      if (!fieldExists) return;

      const input = document.getElementById('collectionDate');
      if (input && !input.value) {
        input.value = todayLocalIso();
        saveCurrentDraft();
      }
    }

    function getCurrentMissingField(fieldId) {
      if (!currentPatient) return null;

      return (currentPatient.missingFields || []).find(
        field => field.id === fieldId
      ) || null;
    }

    function renderWarnings(data) {
      const warningNotice = document.getElementById('warningNotice');
      const duplicateNotice = document.getElementById('duplicateNotice');

      const warnings = [];

      if (Array.isArray(data.missingHeaders) && data.missingHeaders.length) {
        warnings.push(
          'These Sheet1 headers are missing, so they cannot be reviewed until the headers are added: ' +
          data.missingHeaders.join(', ')
        );
      }

      if (Array.isArray(data.blankFinRows) && data.blankFinRows.length) {
        warnings.push(
          `${data.blankFinRows.length} Sheet1 row${data.blankFinRows.length === 1 ? '' : 's'} contain data but have a blank FIN and cannot be reviewed.`
        );
      }

      if (warnings.length) {
        warningNotice.textContent = warnings.join(' ');
        warningNotice.className = 'notice warning visible';
      } else {
        warningNotice.textContent = '';
        warningNotice.className = 'notice warning';
      }

      const duplicates = Array.isArray(data.duplicateSheet1Fins)
        ? data.duplicateSheet1Fins
        : [];

      if (duplicates.length) {
        duplicateNotice.textContent =
          'Duplicate FIN values were found in Sheet1 and were not included in the review queue: ' +
          duplicates.map(item => `${item.fin} (${item.count} rows)`).join(', ') +
          '. Correct the duplicate rows before those patients can be safely updated.';

        duplicateNotice.className = 'notice error visible';
      } else {
        duplicateNotice.textContent = '';
        duplicateNotice.className = 'notice error';
      }
    }

    function showEndState(data) {
      const duplicates = Array.isArray(data.duplicateSheet1Fins)
        ? data.duplicateSheet1Fins
        : [];
      const missingHeaders = Array.isArray(data.missingHeaders)
        ? data.missingHeaders
        : [];
      const blankFinRows = Array.isArray(data.blankFinRows)
        ? data.blankFinRows
        : [];

      const container = document.getElementById('patientContainer');
      const blockers = [];

      if (duplicates.length) {
        blockers.push('duplicate FIN values');
      }
      if (missingHeaders.length) {
        blockers.push('missing Sheet1 headers');
      }
      if (blankFinRows.length) {
        blockers.push('rows with data but no FIN');
      }

      if (blockers.length) {
        container.innerHTML = `
          <div class="error-panel visible">
            <h2>No additional reviewable patients are available.</h2>
            <p>The workflow cannot mark the project complete because Sheet1 still has ${escapeHtml(blockers.join(', '))}. Correct these items, then refresh this page.</p>
          </div>
        `;
        setStatus('Sheet1 requires correction', 'error');
        document.getElementById('progressBar').style.width = '0%';
        document.getElementById('progressText').textContent = 'Needs correction';
      } else {
        container.innerHTML = `
          <div class="empty-patient">
            <div class="empty-icon">✓</div>
            <h2>All patient records have been completed.</h2>
            <p>There are no remaining patients in Sheet1 with missing review fields.</p>
          </div>
        `;
        setStatus(`${data.sheetName || 'Sheet1'} • complete`, 'ready');
        document.getElementById('progressBar').style.width = '100%';
        document.getElementById('progressText').textContent = 'Complete';
      }

      document.getElementById('actionBar').style.display = 'none';
    }

    function showPatientLoadError(fin, message) {
      const container = document.getElementById('patientContainer');

      container.innerHTML = `
        <div class="error-panel visible">
          <h2>Patient could not be loaded</h2>
          <p>FIN: ${escapeHtml(fin || '')}\n${escapeHtml(message || '')}</p>
        </div>
      `;

      updateButtons();
    }

    function showFatalError(message) {
      document.getElementById('patientContainer').innerHTML = '';
      document.getElementById('errorMessage').textContent = message;
      document.getElementById('errorPanel').classList.add('visible');
      document.getElementById('actionBar').style.display = 'none';
      setStatus('Connection error', 'error');
    }

    function clearFatalError() {
      document.getElementById('errorPanel').classList.remove('visible');
      document.getElementById('errorMessage').textContent = '';
      document.getElementById('actionBar').style.display = '';
    }

    function updateStatus(data) {
      const count = Number(data.reviewCount || 0);
      setStatus(
        `${data.sheetName || 'Sheet1'} • ${count} patient${count === 1 ? '' : 's'} need review`,
        'ready'
      );
    }

    function setStatus(text, state) {
      const pill = document.getElementById('appStatus');
      const statusText = document.getElementById('statusText');

      pill.classList.remove('ready', 'error');

      if (state) {
        pill.classList.add(state);
      }

      statusText.textContent = text;
    }

    function updateProgress() {
      if (!reviewQueue.length || currentIndex < 0) {
        document.getElementById('progressBar').style.width = '0%';
        document.getElementById('progressText').textContent = 'Loading…';
        return;
      }

      const current = currentIndex + 1;
      const total = reviewQueue.length;
      const percentage = Math.min(100, Math.max(0, (current / total) * 100));

      document.getElementById('progressBar').style.width = `${percentage}%`;
      document.getElementById('progressText').textContent =
        `Patient ${current} of ${total}`;
    }

    function updateButtons() {
      const previous = document.getElementById('previousButton');
      const skip = document.getElementById('skipButton');
      const save = document.getElementById('saveNextButton');

      previous.disabled = isBusy || currentIndex <= 0;
      skip.disabled = isBusy || !currentPatient;
      save.disabled = isBusy || !currentPatient;

      if (currentPatient && currentPatient.completed) {
        save.textContent = 'Next Patient';
      } else {
        save.textContent = 'Save & Next';
      }
    }

    function setBusy(busy, message) {
      isBusy = busy;

      const overlay = document.getElementById('loadingOverlay');
      const loadingText = document.getElementById('loadingText');

      if (message) {
        loadingText.textContent = message;
      }

      overlay.classList.toggle('visible', busy);
      updateButtons();
    }

    function showToast(message, type) {
      const toast = document.getElementById('toast');

      toast.textContent = message;
      toast.className = `toast visible ${type || 'success'}`;

      window.clearTimeout(toastTimer);

      toastTimer = window.setTimeout(() => {
        toast.classList.remove('visible');
      }, 5200);
    }

    function serverGetReviewBootstrap() {
      return serverPromise((success, failure) => {
        google.script.run
          .withSuccessHandler(success)
          .withFailureHandler(failure)
          .getReviewBootstrap();
      }, 'Loading patients from Sheet1');
    }

    function serverGetPatientReviewData(fin) {
      return serverPromise((success, failure) => {
        google.script.run
          .withSuccessHandler(success)
          .withFailureHandler(failure)
          .getPatientReviewData(fin);
      }, 'Loading the patient record');
    }

    function serverSavePatientMissingData(payload) {
      return serverPromise((success, failure) => {
        google.script.run
          .withSuccessHandler(success)
          .withFailureHandler(failure)
          .savePatientMissingData(payload);
      }, 'Saving the patient record');
    }

    function serverPromise(invoke, label) {
      return new Promise((resolve, reject) => {
        let settled = false;

        const timer = window.setTimeout(() => {
          if (settled) return;
          settled = true;
          reject(
            new Error(
              `${label} took longer than expected. The page was unlocked so it does not freeze. Please try again.`
            )
          );
        }, SERVER_TIMEOUT_MS);

        const success = result => {
          if (settled) return;
          settled = true;
          window.clearTimeout(timer);
          resolve(result);
        };

        const failure = error => {
          if (settled) return;
          settled = true;
          window.clearTimeout(timer);
          reject(error instanceof Error ? error : new Error(getErrorMessage(error)));
        };

        try {
          invoke(success, failure);
        } catch (error) {
          failure(error);
        }
      });
    }

    function getErrorMessage(error) {
      if (!error) return 'An unexpected error occurred.';
      if (error.message) return error.message;
      return String(error);
    }

    function normalizeFin(value) {
      let text = String(value || '')
        .trim()
        .replace(/\s+/g, '')
        .replace(/^'+/, '')
        .replace(/,/g, '');

      if (/^\d+\.0+$/.test(text)) {
        text = text.replace(/\.0+$/, '');
      }

      if (/^\d+$/.test(text)) {
        text = text.replace(/^0+(?=\d)/, '');
      }

      return text.toUpperCase();
    }

    function finKey(value) {
      return normalizeFin(value);
    }

    function todayLocalIso() {
      const now = new Date();
      const offset = now.getTimezoneOffset() * 60000;
      return new Date(now.getTime() - offset).toISOString().slice(0, 10);
    }

    function escapeHtml(value) {
      return String(value === null || value === undefined ? '' : value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function cssEscape(value) {
      if (window.CSS && CSS.escape) {
        return CSS.escape(value);
      }

      return String(value).replace(/[^a-zA-Z0-9_-]/g, '\\$&');
    }
  </script>
</body>
