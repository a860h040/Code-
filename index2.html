<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    :root {
      --navy: #12365a;
      --blue: #1f6ea9;
      --blue-light: #eaf4fb;
      --ink: #17212b;
      --muted: #64748b;
      --line: #dbe4ec;
      --surface: #ffffff;
      --background: #f4f7fa;
      --working: #087f5b;
      --off: #7c8794;
      --warning: #b45309;
      --shadow: 0 12px 35px rgba(18, 54, 90, 0.10);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input { font: inherit; }

    .topbar {
      background: linear-gradient(135deg, #0f3153, #1f6ea9);
      color: #fff;
      padding: 28px clamp(18px, 5vw, 64px) 76px;
    }

    .topbar-inner {
      width: min(1280px, 100%);
      margin: 0 auto;
    }

    .eyebrow {
      margin: 0 0 8px;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.76;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 3rem);
      line-height: 1.08;
      letter-spacing: -0.035em;
    }

    .subtitle {
      margin: 12px 0 0;
      max-width: 760px;
      color: rgba(255,255,255,0.82);
      font-size: 1rem;
    }

    .page {
      width: min(1280px, calc(100% - 28px));
      margin: -48px auto 40px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid rgba(219, 228, 236, 0.95);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .controls {
      padding: 20px;
      display: grid;
      grid-template-columns: minmax(260px, 1fr) auto;
      gap: 16px;
      align-items: end;
    }

    .field-label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .search-wrap { position: relative; }

    .search-input {
      width: 100%;
      height: 50px;
      padding: 0 46px 0 44px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      color: var(--ink);
      outline: none;
      transition: border-color .18s ease, box-shadow .18s ease;
    }

    .search-input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(31, 110, 169, 0.12);
    }

    .search-icon {
      position: absolute;
      left: 15px;
      bottom: 15px;
      width: 19px;
      height: 19px;
      color: var(--muted);
      pointer-events: none;
    }

    .clear-search {
      position: absolute;
      right: 10px;
      bottom: 9px;
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      display: none;
    }

    .clear-search:hover { background: #eef3f7; color: var(--ink); }

    .suggestions {
      position: absolute;
      z-index: 30;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      max-height: 330px;
      overflow-y: auto;
      padding: 7px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 20px 45px rgba(18,54,90,.18);
      display: none;
    }

    .suggestion {
      width: 100%;
      padding: 11px 12px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }

    .suggestion:hover, .suggestion.active { background: var(--blue-light); }
    .suggestion-name { display: block; font-weight: 800; }
    .suggestion-original { display: block; margin-top: 2px; color: var(--muted); font-size: .82rem; }

    .date-nav {
      display: flex;
      gap: 9px;
      align-items: center;
    }

    .nav-button {
      height: 50px;
      min-width: 50px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      color: var(--navy);
      font-weight: 800;
      cursor: pointer;
    }

    .nav-button:hover:not(:disabled) { background: var(--blue-light); border-color: #b8d7eb; }
    .nav-button:disabled { opacity: .35; cursor: not-allowed; }

    .selected-date {
      min-width: 220px;
      text-align: center;
      line-height: 1.18;
    }

    .date-strip-wrap {
      border-top: 1px solid var(--line);
      padding: 14px 20px 18px;
    }

    .date-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: thin;
      padding-bottom: 3px;
    }

    .date-chip {
      flex: 0 0 auto;
      min-width: 66px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      text-align: center;
    }

    .date-chip:hover { border-color: #9fc9e4; background: var(--blue-light); }
    .date-chip.selected { border-color: var(--blue); background: var(--blue); color: #fff; }
    .chip-weekday { display: block; font-size: .7rem; font-weight: 900; letter-spacing: .06em; }
    .chip-date { display: block; margin-top: 2px; font-size: .93rem; font-weight: 800; }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin: 18px 0;
    }

    .summary-card {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fff;
    }

    .summary-label { color: var(--muted); font-size: .78rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }
    .summary-value { margin-top: 4px; color: var(--navy); font-size: 2rem; font-weight: 900; line-height: 1; }

    .section {
      padding: 22px;
      margin-top: 18px;
    }

    .section-heading {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    h2 { margin: 0; font-size: 1.35rem; letter-spacing: -0.02em; }
    .section-note { margin: 5px 0 0; color: var(--muted); font-size: .9rem; }
    .count-badge { flex: 0 0 auto; padding: 7px 11px; border-radius: 999px; background: var(--blue-light); color: var(--blue); font-size: .82rem; font-weight: 900; }

    .groups {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .shift-group {
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
    }

    .shift-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: #f8fafc;
      border-bottom: 1px solid var(--line);
      font-weight: 900;
    }

    .person-list { display: grid; }

    .person-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      padding: 13px 14px;
      border-bottom: 1px solid #edf2f6;
      cursor: pointer;
      transition: background .16s ease;
    }

    .person-card:last-child { border-bottom: 0; }
    .person-card:hover { background: var(--blue-light); }
    .person-name { font-weight: 850; }
    .person-detail { margin-top: 3px; color: var(--muted); font-size: .82rem; }
    .assignment-code { align-self: center; padding: 6px 9px; border-radius: 9px; background: #edf7f4; color: var(--working); font-size: .82rem; font-weight: 900; }

    .has-shift-tooltip {
      cursor: help;
      text-decoration-line: underline;
      text-decoration-style: dotted;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .has-shift-tooltip:focus {
      outline: 3px solid rgba(31, 110, 169, 0.22);
      outline-offset: 3px;
    }

    .shift-tooltip-popup {
      position: fixed;
      z-index: 200;
      width: max-content;
      max-width: min(360px, calc(100vw - 24px));
      padding: 10px 12px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 10px;
      background: #102a43;
      color: #fff;
      box-shadow: 0 12px 30px rgba(15, 42, 67, .28);
      font-size: .82rem;
      font-weight: 700;
      line-height: 1.4;
      pointer-events: none;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity .12s ease, transform .12s ease;
    }

    .shift-tooltip-popup.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .person-panel { display: none; }

    .person-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }

    .person-name-large { margin: 0; font-size: 1.45rem; }
    .person-meta { margin: 5px 0 0; color: var(--muted); }

    .close-person {
      border: 1px solid var(--line);
      border-radius: 11px;
      background: #fff;
      padding: 9px 12px;
      color: var(--navy);
      font-weight: 800;
      cursor: pointer;
    }

    .table-wrap { margin-top: 16px; overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; }
    table { width: 100%; border-collapse: collapse; min-width: 760px; }
    th, td { padding: 12px 13px; border-bottom: 1px solid #edf2f6; text-align: left; vertical-align: middle; }
    th { background: #f8fafc; color: var(--muted); font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; }
    tr:last-child td { border-bottom: 0; }
    tr.working-row { background: #fbfefd; }

    .status-pill {
      display: inline-flex;
      align-items: center;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: .77rem;
      font-weight: 900;
      white-space: nowrap;
    }

    .status-working { background: #e3f6ef; color: var(--working); }
    .status-off, .status-not-scheduled { background: #edf1f4; color: var(--off); }
    .status-pto, .status-holiday { background: #fff3df; color: var(--warning); }

    .empty-state {
      padding: 34px 20px;
      border: 1px dashed #bdcad5;
      border-radius: 14px;
      color: var(--muted);
      text-align: center;
    }

    .loading {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      background: rgba(244,247,250,.88);
      backdrop-filter: blur(4px);
    }

    .loading-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 22px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: #fff;
      box-shadow: var(--shadow);
      font-weight: 800;
    }

    .spinner {
      width: 22px;
      height: 22px;
      border: 3px solid #d9e8f2;
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }

    .error-banner {
      display: none;
      margin: 18px 0;
      padding: 14px 16px;
      border: 1px solid #fecaca;
      border-radius: 13px;
      background: #fff1f2;
      color: #9f1239;
      font-weight: 700;
    }

    .footer-note { margin: 18px 4px 0; color: var(--muted); font-size: .8rem; text-align: right; }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 860px) {
      .controls { grid-template-columns: 1fr; }
      .date-nav { justify-content: stretch; }
      .selected-date { flex: 1; min-width: 0; }
      .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .groups { grid-template-columns: 1fr; }
    }

    @media (max-width: 540px) {
      .topbar { padding-left: 18px; padding-right: 18px; }
      .page { width: min(100% - 18px, 1280px); }
      .controls, .section { padding: 16px; }
      .summary-grid { gap: 9px; }
      .summary-card { padding: 14px; }
      .summary-value { font-size: 1.65rem; }
      .person-header { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <p class="eyebrow">Daily staffing view</p>
      <h1>Pharmacist Schedule Dashboard</h1>
      <p class="subtitle">Choose a date to see who is working, or type one letter of a first name to find a pharmacist’s complete schedule.</p>
    </div>
  </header>

  <main class="page">
    <div id="errorBanner" class="error-banner" role="alert"></div>

    <section class="panel">
      <div class="controls">
        <div class="search-wrap">
          <label class="field-label" for="personSearch">Find a person</label>
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="m21 20.3-5.2-5.2a7.5 7.5 0 1 0-.7.7l5.2 5.2.7-.7ZM4.5 10.5a6 6 0 1 1 12 0 6 6 0 0 1-12 0Z"/>
          </svg>
          <input id="personSearch" class="search-input" type="search" autocomplete="off"
                 placeholder="Start with one letter, for example A…"
                 aria-autocomplete="list" aria-controls="suggestions" aria-expanded="false">
          <button id="clearSearch" class="clear-search" type="button" aria-label="Clear person search">✕</button>
          <div id="suggestions" class="suggestions" role="listbox"></div>
        </div>

        <div>
          <span class="field-label">Selected date</span>
          <div class="date-nav">
            <button id="previousDate" class="nav-button" type="button" aria-label="Previous date">‹</button>
            <button id="selectedDate" class="nav-button selected-date" type="button" title="Return to daily view">Loading…</button>
            <button id="nextDate" class="nav-button" type="button" aria-label="Next date">›</button>
          </div>
        </div>
      </div>
      <div class="date-strip-wrap">
        <div id="dateStrip" class="date-strip" aria-label="Schedule dates"></div>
      </div>
    </section>

    <section id="summaryGrid" class="summary-grid" aria-label="Daily staffing totals"></section>

    <section id="dailyPanel" class="panel section">
      <div class="section-heading">
        <div>
          <h2 id="dailyTitle">Who is working</h2>
          <p id="dailySubtitle" class="section-note"></p>
        </div>
        <span id="workingCount" class="count-badge">0 working</span>
      </div>
      <div id="dailyGroups" class="groups"></div>
    </section>

    <section id="personPanel" class="panel section person-panel" aria-live="polite">
      <div class="person-header">
        <div>
          <h2 id="personName" class="person-name-large"></h2>
          <p id="personMeta" class="person-meta"></p>
        </div>
        <button id="closePerson" class="close-person" type="button">Back to daily view</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Day</th>
              <th>Assignment</th>
              <th>Meaning</th>
              <th>Hours</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="personScheduleBody"></tbody>
        </table>
      </div>
    </section>

    <p id="footerNote" class="footer-note"></p>
  </main>

  <div id="shiftTooltip" class="shift-tooltip-popup" role="tooltip" aria-hidden="true"></div>

  <div id="loading" class="loading" aria-live="polite">
    <div class="loading-card"><span class="spinner" aria-hidden="true"></span>Loading the schedule…</div>
  </div>

  <script>
    'use strict';

    let dashboardData = null;
    let selectedDateKey = null;
    let highlightedSuggestion = -1;
    let currentSuggestions = [];

    const elements = {};

    document.addEventListener('DOMContentLoaded', function () {
      cacheElements();
      bindEvents();

      google.script.run
        .withSuccessHandler(initializeDashboard)
        .withFailureHandler(showLoadError)
        .getDashboardData();
    });

    function cacheElements() {
      [
        'errorBanner', 'personSearch', 'clearSearch', 'suggestions', 'previousDate',
        'selectedDate', 'nextDate', 'dateStrip', 'summaryGrid', 'dailyPanel',
        'dailyTitle', 'dailySubtitle', 'workingCount', 'dailyGroups', 'personPanel',
        'personName', 'personMeta', 'personScheduleBody', 'closePerson', 'footerNote',
        'shiftTooltip', 'loading'
      ].forEach(function (id) {
        elements[id] = document.getElementById(id);
      });
    }

    function bindEvents() {
      elements.personSearch.addEventListener('input', handleSearchInput);
      elements.personSearch.addEventListener('keydown', handleSearchKeyboard);
      elements.personSearch.addEventListener('focus', handleSearchInput);
      elements.clearSearch.addEventListener('click', clearPersonSearch);
      elements.previousDate.addEventListener('click', function () { changeDate(-1); });
      elements.nextDate.addEventListener('click', function () { changeDate(1); });
      elements.selectedDate.addEventListener('click', showDailyView);
      elements.closePerson.addEventListener('click', showDailyView);

      document.addEventListener('click', function (event) {
        if (!event.target.closest('.search-wrap')) {
          closeSuggestions();
        }
      });

      document.addEventListener('mouseover', handleShiftTooltipEnter);
      document.addEventListener('mousemove', handleShiftTooltipMove);
      document.addEventListener('mouseout', handleShiftTooltipLeave);
      document.addEventListener('focusin', handleShiftTooltipFocus);
      document.addEventListener('focusout', handleShiftTooltipLeave);
    }

    function initializeDashboard(data) {
      dashboardData = data;

      if (!data || !Array.isArray(data.dates) || !data.dates.length) {
        showLoadError(new Error('The dashboard did not receive any schedule dates.'));
        return;
      }

      selectedDateKey = chooseInitialDate(data.dates);
      renderDateStrip();
      renderDailyView();
      elements.footerNote.textContent = 'Source: ' + data.scheduleSheet + ' • Updated ' + data.generatedAt;
      elements.loading.style.display = 'none';
    }

    function chooseInitialDate(dates) {
      const today = getLocalDateKey(new Date());
      const exactToday = dates.find(function (date) { return date.key === today; });
      if (exactToday) return exactToday.key;

      const nextDate = dates.find(function (date) { return date.key > today; });
      return nextDate ? nextDate.key : dates[dates.length - 1].key;
    }

    function renderDateStrip() {
      elements.dateStrip.innerHTML = '';

      dashboardData.dates.forEach(function (date) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'date-chip' + (date.key === selectedDateKey ? ' selected' : '');
        button.dataset.dateKey = date.key;
        button.title = date.fullLabel;
        button.innerHTML = '<span class="chip-weekday"></span><span class="chip-date"></span>';
        button.querySelector('.chip-weekday').textContent = date.weekday;
        button.querySelector('.chip-date').textContent = date.shortLabel;
        button.addEventListener('click', function () {
          selectDate(date.key);
        });
        elements.dateStrip.appendChild(button);
      });
    }

    function selectDate(dateKey) {
      selectedDateKey = dateKey;
      renderDateStrip();
      renderDailyView();

      requestAnimationFrame(function () {
        const selectedChip = elements.dateStrip.querySelector('.date-chip.selected');
        if (selectedChip) {
          selectedChip.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        }
      });
    }

    function changeDate(direction) {
      const currentIndex = dashboardData.dates.findIndex(function (date) {
        return date.key === selectedDateKey;
      });
      const nextIndex = currentIndex + direction;

      if (nextIndex >= 0 && nextIndex < dashboardData.dates.length) {
        selectDate(dashboardData.dates[nextIndex].key);
      }
    }

    function renderDailyView() {
      showDailyView();

      const dateIndex = dashboardData.dates.findIndex(function (date) {
        return date.key === selectedDateKey;
      });
      const date = dashboardData.dates[dateIndex];

      const working = dashboardData.people
        .map(function (person) {
          return { person: person, assignment: person.schedule[dateIndex] };
        })
        .filter(function (item) {
          return item.assignment && item.assignment.working;
        });

      const totals = { day: 0, evening: 0, night: 0, other: 0 };
      working.forEach(function (item) {
        const key = Object.prototype.hasOwnProperty.call(totals, item.assignment.typeKey)
          ? item.assignment.typeKey
          : 'other';
        totals[key] += 1;
      });

      elements.selectedDate.textContent = date.fullLabel;
      elements.dailyTitle.textContent = 'Who is working — ' + date.weekday;
      elements.dailySubtitle.textContent = date.fullLabel + ' • Hover over a shift code to see its definition.';
      elements.workingCount.textContent = working.length + (working.length === 1 ? ' working' : ' working');

      elements.previousDate.disabled = dateIndex === 0;
      elements.nextDate.disabled = dateIndex === dashboardData.dates.length - 1;

      renderSummaryCards(working.length, totals);
      renderWorkingGroups(working);
    }

    function renderSummaryCards(total, totals) {
      const cards = [
        { label: 'Total working', value: total },
        { label: 'Day', value: totals.day },
        { label: 'Evening', value: totals.evening },
        { label: 'Night', value: totals.night }
      ];

      elements.summaryGrid.innerHTML = '';
      cards.forEach(function (card) {
        const item = document.createElement('article');
        item.className = 'summary-card';

        const label = document.createElement('div');
        label.className = 'summary-label';
        label.textContent = card.label;

        const value = document.createElement('div');
        value.className = 'summary-value';
        value.textContent = card.value;

        item.appendChild(label);
        item.appendChild(value);
        elements.summaryGrid.appendChild(item);
      });
    }

    function renderWorkingGroups(workingItems) {
      elements.dailyGroups.innerHTML = '';

      if (!workingItems.length) {
        elements.dailyGroups.innerHTML = '<div class="empty-state">No working assignments were found for this date.</div>';
        return;
      }

      const groupDefinitions = [
        { key: 'day', title: 'Day shifts' },
        { key: 'evening', title: 'Evening shifts' },
        { key: 'night', title: 'Night shifts' },
        { key: 'other', title: 'Other assignments' }
      ];

      groupDefinitions.forEach(function (groupDefinition) {
        const groupItems = workingItems
          .filter(function (item) { return item.assignment.typeKey === groupDefinition.key; })
          .sort(function (a, b) { return a.person.displayName.localeCompare(b.person.displayName); });

        if (!groupItems.length) return;

        const group = document.createElement('section');
        group.className = 'shift-group';

        const header = document.createElement('div');
        header.className = 'shift-header';
        header.innerHTML = '<span></span><span></span>';
        header.children[0].textContent = groupDefinition.title;
        header.children[1].textContent = groupItems.length;

        const list = document.createElement('div');
        list.className = 'person-list';

        groupItems.forEach(function (item) {
          const card = document.createElement('div');
          card.className = 'person-card';
          card.tabIndex = 0;
          card.setAttribute('role', 'button');
          card.setAttribute('aria-label', 'Open schedule for ' + item.person.displayName);

          const text = document.createElement('div');
          const name = document.createElement('div');
          name.className = 'person-name';
          name.textContent = item.person.displayName;

          const detail = document.createElement('div');
          detail.className = 'person-detail';
          detail.textContent = [item.assignment.meaning, item.assignment.hours].filter(Boolean).join(' • ') || 'Assignment details not listed';

          const code = document.createElement('span');
          code.className = 'assignment-code';
          code.textContent = item.assignment.code || 'Working';
          applyShiftTooltip(code, item.assignment);

          text.appendChild(name);
          text.appendChild(detail);
          card.appendChild(text);
          card.appendChild(code);

          card.addEventListener('click', function () { openPersonSchedule(item.person); });
          card.addEventListener('keydown', function (event) {
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault();
              openPersonSchedule(item.person);
            }
          });

          list.appendChild(card);
        });

        group.appendChild(header);
        group.appendChild(list);
        elements.dailyGroups.appendChild(group);
      });
    }

    function handleSearchInput() {
      if (!dashboardData) return;

      const query = normalizeText(elements.personSearch.value);
      elements.clearSearch.style.display = query ? 'block' : 'none';
      highlightedSuggestion = -1;

      if (!query) {
        currentSuggestions = [];
        closeSuggestions();
        return;
      }

      currentSuggestions = dashboardData.people
        .map(function (person) {
          return { person: person, score: getSearchScore(person, query) };
        })
        .filter(function (item) { return item.score < 99; })
        .sort(function (a, b) {
          return a.score - b.score || a.person.displayName.localeCompare(b.person.displayName);
        })
        .slice(0, 10)
        .map(function (item) { return item.person; });

      renderSuggestions();
    }

    function getSearchScore(person, query) {
      const firstName = normalizeText(person.firstName);
      const lastName = normalizeText(person.lastName);
      const displayName = normalizeText(person.displayName);
      const originalName = normalizeText(person.originalName);

      if (firstName.startsWith(query)) return 0;
      if (displayName.startsWith(query)) return 1;
      if (lastName.startsWith(query)) return 2;
      if (firstName.includes(query)) return 3;
      if (displayName.includes(query) || originalName.includes(query) || person.searchText.includes(query)) return 4;
      return 99;
    }

    function renderSuggestions() {
      elements.suggestions.innerHTML = '';

      if (!currentSuggestions.length) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.style.padding = '16px';
        empty.textContent = 'No matching person was found.';
        elements.suggestions.appendChild(empty);
      } else {
        currentSuggestions.forEach(function (person, index) {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'suggestion';
          button.setAttribute('role', 'option');
          button.dataset.index = String(index);

          const displayName = document.createElement('span');
          displayName.className = 'suggestion-name';
          displayName.textContent = person.displayName;

          const original = document.createElement('span');
          original.className = 'suggestion-original';
          original.textContent = person.originalName;

          button.appendChild(displayName);
          button.appendChild(original);
          button.addEventListener('click', function () { chooseSuggestion(index); });
          elements.suggestions.appendChild(button);
        });
      }

      elements.suggestions.style.display = 'block';
      elements.personSearch.setAttribute('aria-expanded', 'true');
    }

    function handleSearchKeyboard(event) {
      if (elements.suggestions.style.display !== 'block' || !currentSuggestions.length) {
        if (event.key === 'Enter' && currentSuggestions.length === 1) {
          event.preventDefault();
          chooseSuggestion(0);
        }
        return;
      }

      if (event.key === 'ArrowDown') {
        event.preventDefault();
        highlightedSuggestion = Math.min(highlightedSuggestion + 1, currentSuggestions.length - 1);
        updateSuggestionHighlight();
      } else if (event.key === 'ArrowUp') {
        event.preventDefault();
        highlightedSuggestion = Math.max(highlightedSuggestion - 1, 0);
        updateSuggestionHighlight();
      } else if (event.key === 'Enter') {
        event.preventDefault();
        chooseSuggestion(highlightedSuggestion >= 0 ? highlightedSuggestion : 0);
      } else if (event.key === 'Escape') {
        closeSuggestions();
      }
    }

    function updateSuggestionHighlight() {
      const buttons = elements.suggestions.querySelectorAll('.suggestion');
      buttons.forEach(function (button, index) {
        button.classList.toggle('active', index === highlightedSuggestion);
      });
      if (buttons[highlightedSuggestion]) {
        buttons[highlightedSuggestion].scrollIntoView({ block: 'nearest' });
      }
    }

    function chooseSuggestion(index) {
      const person = currentSuggestions[index];
      if (!person) return;

      elements.personSearch.value = person.displayName;
      elements.clearSearch.style.display = 'block';
      closeSuggestions();
      openPersonSchedule(person);
    }

    function openPersonSchedule(person) {
      const workingDays = person.schedule.filter(function (assignment) { return assignment.working; }).length;
      elements.personName.textContent = person.displayName;
      elements.personMeta.textContent = person.originalName + ' • ' + workingDays + ' working day' + (workingDays === 1 ? '' : 's');
      elements.personScheduleBody.innerHTML = '';

      person.schedule.forEach(function (assignment, index) {
        const date = dashboardData.dates[index];
        const row = document.createElement('tr');
        if (assignment.working) row.className = 'working-row';

        appendCell(row, date.shortLabel);
        appendCell(row, date.weekday);
        appendAssignmentCell(row, assignment);
        appendCell(row, assignment.meaning || '—');
        appendCell(row, assignment.hours || '—');

        const statusCell = document.createElement('td');
        const pill = document.createElement('span');
        pill.className = 'status-pill status-' + assignment.status;
        pill.textContent = assignment.statusLabel;
        statusCell.appendChild(pill);
        row.appendChild(statusCell);

        elements.personScheduleBody.appendChild(row);
      });

      elements.dailyPanel.style.display = 'none';
      elements.summaryGrid.style.display = 'none';
      elements.personPanel.style.display = 'block';
      elements.personPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function appendAssignmentCell(row, assignment) {
      const cell = document.createElement('td');
      const code = document.createElement('span');
      code.textContent = assignment.code || '—';
      applyShiftTooltip(code, assignment);
      cell.appendChild(code);
      row.appendChild(cell);
    }

    function applyShiftTooltip(element, assignment) {
      const tooltipText = assignment && assignment.tooltip
        ? assignment.tooltip
        : buildClientTooltip(assignment);

      if (!tooltipText || !assignment || !assignment.code) return;

      element.classList.add('has-shift-tooltip');
      element.tabIndex = 0;
      element.dataset.shiftTooltip = tooltipText;
      element.setAttribute('aria-label', tooltipText);
    }

    function buildClientTooltip(assignment) {
      if (!assignment) return '';
      const code = assignment.code || '';
      const details = [];
      if (assignment.meaning) details.push(assignment.meaning);
      if (assignment.hours) details.push('Hours: ' + assignment.hours);
      if (assignment.type && assignment.type !== 'Other') details.push('Shift type: ' + assignment.type);
      if (!details.length && assignment.statusLabel) details.push(assignment.statusLabel);
      return code + (details.length ? ' — ' + details.join(' • ') : '');
    }

    function getShiftTooltipTarget(event) {
      return event.target && typeof event.target.closest === 'function'
        ? event.target.closest('.has-shift-tooltip')
        : null;
    }

    function handleShiftTooltipEnter(event) {
      const target = getShiftTooltipTarget(event);
      if (!target || !target.dataset.shiftTooltip) return;
      showShiftTooltip(target.dataset.shiftTooltip);
      positionShiftTooltipAtPointer(event.clientX, event.clientY);
    }

    function handleShiftTooltipMove(event) {
      if (!elements.shiftTooltip.classList.contains('visible')) return;
      if (!getShiftTooltipTarget(event)) return;
      positionShiftTooltipAtPointer(event.clientX, event.clientY);
    }

    function handleShiftTooltipFocus(event) {
      const target = getShiftTooltipTarget(event);
      if (!target || !target.dataset.shiftTooltip) return;
      showShiftTooltip(target.dataset.shiftTooltip);
      positionShiftTooltipAtElement(target);
    }

    function handleShiftTooltipLeave(event) {
      const leaving = getShiftTooltipTarget(event);
      if (!leaving) return;

      const entering = event.relatedTarget && event.relatedTarget.closest
        ? event.relatedTarget.closest('.has-shift-tooltip')
        : null;
      if (entering === leaving) return;

      hideShiftTooltip();
    }

    function showShiftTooltip(text) {
      elements.shiftTooltip.textContent = text;
      elements.shiftTooltip.setAttribute('aria-hidden', 'false');
      elements.shiftTooltip.classList.add('visible');
    }

    function hideShiftTooltip() {
      elements.shiftTooltip.classList.remove('visible');
      elements.shiftTooltip.setAttribute('aria-hidden', 'true');
    }

    function positionShiftTooltipAtPointer(clientX, clientY) {
      positionShiftTooltip(clientX + 14, clientY + 16);
    }

    function positionShiftTooltipAtElement(element) {
      const rect = element.getBoundingClientRect();
      positionShiftTooltip(rect.left + rect.width / 2, rect.bottom + 10, true);
    }

    function positionShiftTooltip(left, top, centerOnPoint) {
      const tooltip = elements.shiftTooltip;
      const margin = 12;
      const width = tooltip.offsetWidth;
      const height = tooltip.offsetHeight;
      let adjustedLeft = centerOnPoint ? left - width / 2 : left;
      let adjustedTop = top;

      adjustedLeft = Math.max(margin, Math.min(adjustedLeft, window.innerWidth - width - margin));
      if (adjustedTop + height > window.innerHeight - margin) {
        adjustedTop = Math.max(margin, top - height - 28);
      }

      tooltip.style.left = adjustedLeft + 'px';
      tooltip.style.top = adjustedTop + 'px';
    }

    function appendCell(row, text) {
      const cell = document.createElement('td');
      cell.textContent = text;
      row.appendChild(cell);
    }

    function showDailyView() {
      elements.dailyPanel.style.display = 'block';
      elements.summaryGrid.style.display = 'grid';
      elements.personPanel.style.display = 'none';
    }

    function clearPersonSearch() {
      elements.personSearch.value = '';
      elements.clearSearch.style.display = 'none';
      closeSuggestions();
      showDailyView();
      elements.personSearch.focus();
    }

    function closeSuggestions() {
      elements.suggestions.style.display = 'none';
      elements.personSearch.setAttribute('aria-expanded', 'false');
      highlightedSuggestion = -1;
    }

    function normalizeText(value) {
      return String(value || '')
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9]+/g, ' ')
        .trim();
    }

    function getLocalDateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return year + '-' + month + '-' + day;
    }

    function showLoadError(error) {
      elements.loading.style.display = 'none';
      elements.errorBanner.style.display = 'block';
      elements.errorBanner.textContent = error && error.message
        ? error.message
        : 'The schedule could not be loaded. Check the Apps Script execution log.';
    }
  </script>
</body>
</html>
